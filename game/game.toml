# game.toml — Arcus Odyssey (Wolf Team, 1991), USA NTSC, our patched ROM.
#
# Input: ../build/arcus-native.bin (tools/build.py --native), 2 MB file:
#   $000000-$0FFFFF  original 1 MB game (with call-site patches)
#   $100000-$1000FF  twin-stick hook (patch/twinstick.asm): jmp table $100000 PadRead, $100006 AimHook
#   $100400-$10043F  widescreen helpers (patch/widescreen.asm): $100400 MapColFg,
#                    $100406 MapColBg, $10040C InitAdvance
#   $100600-          native patches (patch/native.asm): 9-entry jmp table $100600-$100630
#                    (camera start/edge stops, auto-scroll wrap, 2P bounds, aim release)
#   rest             $FF padding
# Vectors: SSP $FFFC00, reset $00020E, V-int $0003D8, H-int $0003DA. Every other
# exception / TRAP / line-A / line-F vector points at the default handler $000200.
# No community disassembly: heuristic discovery + runtime evidence (as RKA).

[game]
output_prefix = "arcus"
jump_table_autodiscovery = true
# Executed-PC evidence from tools/coverage.py --mode interp --fold (additive gate: observed code,
# promoted to functions only where structure proves a boundary).
runtime_exec_file = "exec_pcs.txt"

[ram_layout]
game_mode      = 0x000000     # cosmetic; unknown yet
vint_runcount  = 0x000000
vint_routine   = 0x000000
plc_pending    = 0x000000     # no Sonic PLC system
initial_ssp    = 0xFFFFFC00   # reset SSP (LOAD-BEARING)
vbla_stack     = 0xFFFFFC00
intr_stack     = 0xFFFFFC00   # interrupt delivery stack (LOAD-BEARING)
player_object  = 0x000000
level_modes    = []

[functions]
# Entry, V-int, H-int, default exception handler, and our patch entry points.
extra = [0x00020E, 0x0003D8, 0x0003DA, 0x000200,
         0x100000, 0x100006, 0x100400, 0x100406, 0x10040C,
         0x100600, 0x100606, 0x10060C, 0x100612, 0x100618, 0x10061E, 0x100624, 0x10062A,
         0x100630, 0x100636, 0x10063C, 0x100642, 0x100648,
         # Save-state resume points (game/arcus_saves.c): the gameplay frame loop's top
         # $6C7E, $6C86 (the area setup branches there), and its two VBlank waits, the
         # JSR $1A9E at $6D3C and at $6DF8. A load restarts the game fiber at one of these.
         0x006C7E, 0x006C86, 0x006D3C, 0x006DF8]

# BEGIN coverage.py late_extra
# Computed-call targets seen on the interpreter floor, each starting right after a
# terminator (tools/coverage.py --mode native --fold), plus reviewed starts right after data
